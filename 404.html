  <title>Redirecting...</title>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase().replace(/^/+|/+$/g, '');
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      
      var routingTable = {
  "18": "https://alanpruitt.com/essays/18-the-illusion-of-the-feed",

  "essay18": "https://alanpruitt.com/essays/18-the-illusion-of-the-feed",
  "essays/25-curriculum-as-code-sovereign-infrastructure": "https://alanpruitt.com/essays/25-curriculum-as-code-sovereign-infrastructure",
  "25-curriculum-as-code-sovereign-infrastructure": "https://alanpruitt.com/essays/25-curriculum-as-code-sovereign-infrastructure",
  "essays/25": "https://alanpruitt.com/essays/25-curriculum-as-code-sovereign-infrastructure",
  "essays/essay-25": "https://alanpruitt.com/essays/25-curriculum-as-code-sovereign-infrastructure",

  "essay25": "https://alanpruitt.com/essays/25-curriculum-as-code-sovereign-infrastructure",
  "essays/26-curriculum-as-code-pour-audit-framework": "https://alanpruitt.com/essays/26-curriculum-as-code-pour-audit-framework",

  "essays": "https://alanpruitt.com/essays/",
  "essays/index.html": "https://alanpruitt.com/essays/"
};
      
      // Match direct path or nested essay paths
      if (routingTable[path]) {
        window.location.replace(routingTable[path] + search + hash);
        return;
      }
      
      // Fuzzy match essay number patterns (e.g. /essays/18 or /essay-18)
      var essayMatch = path.match(/(?:essays?/)?(?:essay[-_]?)?(d+)/);
      if (essayMatch && essayMatch[1]) {
        var num = essayMatch[1];
        if (routingTable['essays/' + num] || routingTable['essays/essay-' + num]) {
          var dest = routingTable['essays/' + num] || routingTable['essays/essay-' + num];
          window.location.replace(dest + search + hash);
          return;
        }
      }

      // Default fallback
      window.location.replace('https://alanpruitt.com/');
    })();
  </script>
