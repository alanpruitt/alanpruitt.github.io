[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "JSON", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true

[languages]
  [languages.en]
    label = "EN"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "Alan Pruitt — Curriculum-as-Code & OER Manifesto"

  [languages.es]
    label = "ES"
    locale = "es-MX"
    contentDir = "content/es"
    weight = 2
    title = "Alan Pruitt — Arquitectura Curriculum-as-Code y Manifiesto OER"

