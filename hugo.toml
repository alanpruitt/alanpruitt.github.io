bbaseURL = "https://alanpruitt.com/"
enableMissingTranslationPlaceholders = false

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[markup.goldmark.renderer]
  unsafe = true

[languages]
  [languages.en]
    label = "EN"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "Coach Alan"

  [languages.es]
    label = "ES"
    locale = "es-MX"
    contentDir = "content/es"
    weight = 2
    title = "Coach Alan"

# Inside [languages.en] menu definition:
[[languages.en.menu.main]]
  name = "ROI Calculator"
  url = "/roi-calculator/"
  weight = 4

# Inside [languages.es] menu definition:
[[languages.es.menu.main]]
  name = "Calculadora ROI"
  url = "/roi-calculator/"
  weight = 4
