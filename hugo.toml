bbaseURL = "https://alanpruitt.com/"
enableMissingTranslationPlaceholders = false

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[markup.goldmark.renderer]
  unsafe = true

[languages]
  [languages.en]
    label = "EN"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "Coach Alan"

  [languages.es]
    label = "ES"
    locale = "es-MX"
    contentDir = "content/es"
    weight = 2
    title = "Coach Alan"
