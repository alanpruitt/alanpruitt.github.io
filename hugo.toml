baseURL = "https://alanpruitt.com/"
enableMissingTranslationPlaceholders = false
disableKinds = ["taxonomy", "term"]

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  description = "Alan Pruitt (Coach Alan) — Curriculum Architect, Sovereign AI Strategist, USMC Veteran & Founder of Webcognita LLC. Pioneering Curriculum-as-Code (S-A-R Standard), ADA Title II / WCAG 2.2 AA (9:1) compliance, and $0 ZTC Open Educational Resources (OER)."
  defaultImage = "assets/og-preview.png"
  defaultImageAlt = "Alan Pruitt (Coach Alan) — Curriculum-as-Code, Digital Accessibility Governance & OER Manifesto"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[languages]
  [languages.en]
    label = "EN"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "Coach Alan"

  [languages.es]
    label = "ES"
    locale = "es-MX"
    contentDir = "content/es"
    weight = 2
    title = "Coach Alan"

# Inside [languages.en] menu definition:
[[languages.en.menu.main]]
  name = "ROI Calculator"
  url = "/roi-calculator/"
  weight = 4

# Inside [languages.es] menu definition:
[[languages.es.menu.main]]
  name = "Calculadora ROI"
  url = "/roi-calculator/"
  weight = 4

