baseURL = "https://alanpruitt.com/"
locale = "en-US"
title = "Alan Pruitt — Curriculum-as-Code & OER Manifesto"
enableMissingTranslationPlaceholders = false
disableKinds = ["taxonomy", "term"]

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  description = "Alan Pruitt (Coach Alan) — Founder of Webcognita LLC (SDVOSB), AWC Faculty & UArizona DCC. Pioneering Curriculum-as-Code (S-A-R v2.2), Edge AI & ADA Title II."
  defaultImage = "assets/og-preview.png"
  defaultImageAlt = "Alan Pruitt (Coach Alan) — Curriculum-as-Code, Digital Accessibility Governance & OER Manifesto"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "JSON", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true

[languages]
  [languages.en]
    label = "EN"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "Alan Pruitt — Curriculum-as-Code & OER Manifesto"

  [languages.es]
    label = "ES"
    locale = "es-MX"
    contentDir = "content/es"
    weight = 2
    title = "Alan Pruitt — Arquitectura Curriculum-as-Code y Manifiesto OER"

# Inside [languages.en] menu definition:
[[languages.en.menu.main]]
  name = "ROI Calculator"
  url = "/roi-calculator/"
  weight = 4

# Inside [languages.es] menu definition:
[[languages.es.menu.main]]
  name = "Calculadora ROI"
  url = "/roi-calculator/"
  weight = 4
