name: POUR Accessibility Audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  accessibility-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run POUR Audit Script
      run: |
        python pour_audit.py .
