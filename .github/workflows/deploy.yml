name: Deploy Hugo Site with WCAG & Route Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Hugo Static Site
        run: hugo --minify

      - name: Run Markdown Linter Check
        run: npx markdownlint-cli2 "**/*.md"

      - name: Start Local Static Server & Run Playwright Audit
        run: |
          # Replicate production subpath folder layout for local test serve
          mkdir -p test-dist/alanpruitt
          cp -R public/* test-dist/alanpruitt/

          # Serve the test-dist directory on port 1313 in background
          npx serve test-dist -l 1313 &
          SERVER_PID=$!

          # Wait for the local server to be responsive
          npx wait-on http://localhost:1313/alanpruitt

          # Execute the automated WCAG 2.2 AA & Multilingual Route Audit
          BASE_URL=http://localhost:1313/alanpruitt node scripts/audit.js

          # Terminate the background server process
          kill $SERVER_PID

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-audit
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
