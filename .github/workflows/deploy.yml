name: Deploy Hugo Site with WCAG & Route Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Hugo Static Site
        run: |
          mkdir -p public
          cp -r essays public/ 2>/dev/null || true
          cp -r articles public/ 2>/dev/null || true
          hugo --minify
          cp CNAME public/ 2>/dev/null || true

      - name: Run Markdown Linter Check
        run: npm run lint:md

      - name: Start Local Static Server & Run Playwright Audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx serve public -l 1313 &
          SERVER_PID=$!
          npx wait-on http://localhost:1313/
          BASE_URL=http://localhost:1313 node scripts/audit.js
          AUDIT_EXIT=$?
          kill $SERVER_PID
          exit $AUDIT_EXIT

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-audit
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
