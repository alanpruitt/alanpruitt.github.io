<!-- Executive Print Header (Only visible on paper / PDF export) -->
<div class="print-header-badge" aria-hidden="true">
  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <span style="font-size: 13pt; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">Alan Pruitt &bull; Executive Brief</span>
    <span style="font-size: 9pt; color: #555;">alanpruitt.com</span>
  </div>
</div>

<!-- Screen Article Header with Print / PDF Action Button -->
<div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between border-b border-zinc-200 pb-6 dark:border-zinc-800 text-left">
  <div>
    <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      <span>&bull;</span>
      <span>{{ .ReadingTime }} min read</span>
    </div>
  </div>

  <!-- Accessible Print Button (Hidden in Print Mode via .no-print) -->
  <div class="no-print">
    <button 
      type="button" 
      onclick="window.print()" 
      class="inline-flex min-h-[44px] items-center gap-2 rounded-lg border border-zinc-300 bg-white px-3.5 py-2 text-xs font-bold uppercase tracking-wider text-zinc-800 shadow-sm transition hover:bg-zinc-50 hover:text-zinc-950 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200 dark:hover:bg-zinc-800 dark:hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-zinc-950 dark:focus-visible:outline-white"
      aria-label="Print or save this essay as a PDF"
    >
      <svg class="h-4 w-4 shrink-0 text-zinc-600 dark:text-zinc-300" style="width: 16px !important; height: 16px !important;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
      </svg>
      <span>{{ if eq .Lang "es" }}Imprimir / PDF{{ else }}Print / Save PDF{{ end }}</span>
    </button>
  </div>
</div>
