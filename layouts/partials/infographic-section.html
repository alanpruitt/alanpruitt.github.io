<section class="py-10 sm:py-14 border-b border-zinc-200 bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900/40" aria-labelledby="cac-infographic-heading">
  <div class="w-full max-w-4xl px-4 sm:px-6 lg:px-8 text-left mr-auto ml-0">
    
    <!-- Section Heading -->
    <div class="mb-6 text-left sm:mb-8 mr-auto ml-0">
      <h2 id="cac-infographic-heading" class="text-2xl font-extrabold tracking-tight text-zinc-950 dark:text-white sm:text-3xl text-left">
        Academic Sovereignty via Curriculum-as-Code
      </h2>
      <p class="mt-2 text-sm text-zinc-900 dark:text-zinc-100 sm:text-base text-left">
        Executive blueprint: Navigating the ADA Title II compliance cliff with Git-backed SSoT pipelines and automated headless Canvas LMS deployment.
      </p>
    </div>

    <!-- Infographic Figure Container -->
    <figure class="relative w-full overflow-hidden rounded-2xl border border-zinc-300 bg-white p-1.5 shadow-sm dark:border-zinc-700 dark:bg-zinc-950 sm:p-4 text-left mr-auto ml-0 block">
      
      <!-- Trigger Button for Native Modal -->
      <button 
        type="button"
        onclick="document.getElementById('cac-infographic-modal').showModal()"
        class="group relative block w-full cursor-zoom-in overflow-hidden rounded-xl text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-zinc-950 dark:focus-visible:outline-white"
        aria-label="Open full resolution infographic in modal dialog"
      >
        <picture class="block w-full text-left mr-auto ml-0">
          <source srcset="/images/academic-sovereignty-cac-infographic.webp" type="image/webp">
          <img 
            src="/images/academic-sovereignty-cac-infographic.png" 
            alt="Academic Sovereignty via Curriculum-as-Code Infographic: Details the Risk Matrix (ADA Title II Compliance Cliff), 3-Step Pipeline (Markdown SSoT, Automated Axe-core Testing, Headless Canvas REST API Deployment), Quantified ROI ($63,900 net budget recaptured, 18.8x ROI multiplier, 1,420 hours reclaimed), and the Pedagogical Mission Loop." 
            class="block w-full h-auto max-w-full rounded-lg object-contain text-left mr-auto ml-0 transition-transform duration-300 ease-out group-hover:scale-[1.005]"
            loading="lazy"
            decoding="async"
            width="1080"
            height="1920"
            style="aspect-ratio: 1080 / 1920; height: auto; margin-left: 0; margin-right: auto;"
          />
        </picture>

        <!-- Discreet, Refined Micro-Badge (Fixed 12px Icon, Clean Font) -->
        <div class="absolute bottom-2.5 right-2.5 inline-flex items-center gap-1 rounded-full border border-zinc-200/50 bg-zinc-950/80 px-2.5 py-1 text-[10px] font-medium tracking-wide text-zinc-100 shadow-sm backdrop-blur-md dark:border-zinc-700/50 dark:bg-zinc-900/90 dark:text-zinc-200 pointer-events-none">
          <svg class="h-3 w-3 shrink-0 text-zinc-300" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM10.5 7.5v6m3-3h-6" />
          </svg>
          <span>Expand</span>
        </div>
      </button>

      <figcaption class="mt-3 text-left text-xs text-zinc-900 dark:text-zinc-100 mr-auto ml-0">
        Figure 1.0: End-to-End Curriculum-as-Code (CaC) Continuous Integration & Mission Loop Architecture.
      </figcaption>
    </figure>

    <!-- Accessible Native HTML5 Modal Lightbox -->
    <dialog 
      id="cac-infographic-modal" 
      class="backdrop:bg-zinc-950/80 backdrop:backdrop-blur-sm m-auto max-h-[92vh] max-w-[94vw] rounded-2xl border border-zinc-300 bg-white p-2 shadow-2xl dark:border-zinc-700 dark:bg-zinc-950 sm:p-4 text-left"
      onclick="if (event.target === this) this.close()"
      aria-labelledby="modal-title"
    >
      <div class="flex items-center justify-between border-b border-zinc-200 pb-3 mb-3 dark:border-zinc-800">
        <h3 id="modal-title" class="text-sm font-bold text-zinc-950 dark:text-white">
          Academic Sovereignty via Curriculum-as-Code
        </h3>
        <button 
          type="button" 
          onclick="document.getElementById('cac-infographic-modal').close()" 
          class="inline-flex min-h-[44px] min-w-[44px] items-center justify-center rounded-lg text-zinc-900 hover:bg-zinc-100 hover:text-zinc-950 dark:text-zinc-100 dark:hover:bg-zinc-900 dark:hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-zinc-950 dark:focus-visible:outline-white"
          aria-label="Close dialog"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="overflow-y-auto max-h-[78vh] rounded-lg">
        <picture>
          <source srcset="/images/academic-sovereignty-cac-infographic.webp" type="image/webp">
          <img 
            src="/images/academic-sovereignty-cac-infographic.png" 
            alt="Full resolution high-detail view of the Academic Sovereignty via Curriculum-as-Code Infographic." 
            class="w-full h-auto rounded-md"
            loading="lazy"
          />
        </picture>
      </div>
    </dialog>

    <!-- Accessible Text Alternative Accordion -->
    <div class="w-full text-left mr-auto ml-0">
      {{ partial "infographic-transcript.html" . }}
    </div>

  </div>
</section>
