<style>
  @media print {
    /* Reset layout and force standard print margins */
    @page {
      margin: 20mm 15mm 20mm 15mm;
      size: auto;
    }

    /* Base Reset: enforce pure white background and crisp black ink */
    *,
    *::before,
    *::after {
      background: transparent !important;
      color: #000 !important;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
      font-size: 11pt !important;
      line-height: 1.5 !important;
      color: #111 !important;
    }

    /* Hide non-printable screen interface elements */
    header,
    nav,
    footer,
    .no-print,
    #site-header,
    #site-footer,
    #language-switcher,
    .language-switcher,
    button,
    .interactive-widget,
    dialog {
      display: none !important;
    }

    /* Container adjustments: Expand to full width */
    main,
    article,
    .max-w-4xl,
    .max-w-5xl,
    .container {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
    }

    /* Typography hierarchy for print */
    h1 {
      font-size: 20pt !important;
      line-height: 1.2 !important;
      margin-top: 0 !important;
      margin-bottom: 12pt !important;
      page-break-after: avoid;
      break-after: avoid;
    }

    h2 {
      font-size: 15pt !important;
      margin-top: 18pt !important;
      margin-bottom: 8pt !important;
      border-bottom: 1px solid #ddd !important;
      padding-bottom: 4pt !important;
      page-break-after: avoid;
      break-after: avoid;
    }

    h3 {
      font-size: 12pt !important;
      margin-top: 14pt !important;
      margin-bottom: 6pt !important;
      page-break-after: avoid;
      break-after: avoid;
    }

    p, li {
      orphans: 3;
      widows: 3;
    }

    /* Blockquotes & Callouts */
    blockquote {
      border-left: 3pt solid #333 !important;
      padding-left: 10pt !important;
      margin: 12pt 0 !important;
      font-style: italic !important;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    /* Code & Preformatted Blocks */
    pre, code {
      font-family: "Courier New", Courier, monospace !important;
      font-size: 9.5pt !important;
      border: 1px solid #ccc !important;
      background-color: #f9f9f9 !important;
      page-break-inside: avoid;
      break-inside: avoid;
      white-space: pre-wrap !important;
      word-break: break-word !important;
    }

    /* Tables */
    table {
      width: 100% !important;
      border-collapse: collapse !important;
      page-break-inside: avoid;
      break-inside: avoid;
      margin: 12pt 0 !important;
    }

    th, td {
      border: 1px solid #bbb !important;
      padding: 6pt 8pt !important;
      font-size: 9pt !important;
      text-align: left !important;
    }

    th {
      background-color: #eee !important;
      font-weight: bold !important;
    }

    /* Automatic Hyperlink Expansion: Show URLs beside link text */
    article a[href^="http://"]::after,
    article a[href^="https://"]::after {
      content: " (" attr(href) ")";
      font-size: 8.5pt;
      font-weight: normal;
      color: #444 !important;
    }

    /* Don't show URL for relative or internal links */
    article a[href^="#"]::after,
    article a[href^="/"]::after {
      content: "";
    }

    /* Executive Header Badge inserted during print */
    .print-header-badge {
      display: block !important;
      border-bottom: 2pt solid #000;
      padding-bottom: 8pt;
      margin-bottom: 16pt;
    }
  }

  /* Screen Default: hide print-only header badge */
  .print-header-badge {
    display: none;
  }
</style>
