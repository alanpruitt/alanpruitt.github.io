<!DOCTYPE html>
<html lang="{{ .Lang | default "en" }}" class="h-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Alan Pruitt</title>
    <meta name="description" content="{{ .Description }}">
    <link rel="canonical" href="{{ .Permalink }}">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230B192C'/></svg>">

    <style>
        :root {
            --bg-creme-50: #fbfbfb;
            --bg-creme-100: #FAF8F5;
            --bg-creme-200: #EAE3D2;
            --text-navy-800: #1B2A4A;
            --text-navy-900: #0B192C;
        }

        *, ::before, ::after { box-sizing: border-box; border-width: 0; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background-color: var(--bg-creme-100); color: var(--text-navy-900); }

        .w-full { width: 100%; }
        .max-w-3xl { max-width: 48rem; }
        .max-w-6xl { max-width: 72rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-grow { flex-grow: 1; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }

        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .py-16 { padding-top: 4rem; padding-bottom: 4rem; }

        .mt-3 { margin-top: 0.75rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-10 { margin-bottom: 2.5rem; }

        .border-b { border-bottom-style: solid; border-bottom-width: 1px; }
        .border-zinc-200 { border-color: #e4e4e7; }
        .border-zinc-850 { border-color: #1f1f23; }

        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .font-extrabold { font-weight: 800; }

        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-base { font-size: 1rem; line-height: 1.5rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }

        .focus-visible\:outline:focus-visible { outline: 2px solid var(--text-navy-900); outline-offset: 2px; }

        /* Prose styles for pages (9:1 high-contrast compliant text) */
        .prose h2 { font-size: 1.5rem; font-weight: 800; color: #09090b; margin-top: 2rem; margin-bottom: 1rem; text-align: left; }
        .prose h3 { font-size: 1.25rem; font-weight: 700; color: #09090b; margin-top: 1.5rem; margin-bottom: 0.75rem; text-align: left; }
        .prose p { margin-top: 0.5rem; margin-bottom: 1rem; font-size: 1rem; line-height: 1.6; color: #18181b; text-align: left; }
        .prose ul { margin-top: 0.5rem; margin-bottom: 1rem; padding-left: 1.5rem; list-style-type: disc; color: #18181b; text-align: left; }
        .prose li { margin-bottom: 0.5rem; }
        .prose hr { margin-top: 2rem; margin-bottom: 2rem; border-top: 1px solid #e4e4e7; }

        /* Dark mode overrides */
        @media (prefers-color-scheme: dark) {
            body { background-color: #09090b; color: #f4f4f5; }
            .prose h2 { color: #ffffff; }
            .prose h3 { color: #ffffff; }
            .prose p { color: #f4f4f5; }
            .prose ul { color: #f4f4f5; }
            .prose hr { border-top: 1px solid #27272a; }
            .border-zinc-200 { border-color: #27272a; }
        }
    </style>
</head>
<body class="bg-creme-100 text-navy-900 font-sans antialiased min-h-full flex flex-col justify-between dark:bg-zinc-950 dark:text-zinc-100">

    {{ partial "header.html" . }}

    <main class="w-full max-w-6xl mx-auto px-6 py-8 flex-grow">
        <article class="mx-auto max-w-3xl px-4 py-10 sm:px-6 sm:py-16 lg:px-8">
            
            <!-- Breadcrumb Navigation -->
            <nav class="mb-6" aria-label="Breadcrumb">
                <a 
                  href="{{ relLangURL "" }}" 
                  class="inline-flex min-h-[44px] items-center text-xs font-bold uppercase tracking-wider text-zinc-900 hover:text-zinc-950 dark:text-zinc-100 dark:hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-zinc-950 dark:focus-visible:outline-white"
                  style="text-decoration: none; color: inherit;"
                >
                  &larr; {{ if eq .Lang "es" }}Volver al Inicio{{ else }}Back to Home{{ end }}
                </a>
            </nav>

            <!-- Title & Description Header -->
            <header class="mb-8 border-b border-zinc-200 pb-6 dark:border-zinc-800">
                <h1 class="text-3xl font-extrabold tracking-tight text-zinc-950 dark:text-white sm:text-4xl text-left">
                  {{ .Title }}
                </h1>
                <p class="mt-3 text-base text-zinc-900 dark:text-zinc-100 text-left">
                  {{ .Description }}
                </p>
            </header>

            <!-- Main Content Area -->
            <div class="prose max-w-none">
                {{ .Content }}
            </div>

        </article>
    </main>

    {{ partial "footer.html" . }}

</body>
</html>
