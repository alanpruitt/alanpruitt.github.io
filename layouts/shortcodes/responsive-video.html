<div class="video-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; border-radius: 8px; border: 2px solid #002147; margin: 1.5rem 0; background-color: #000;">
  {{ if .Get "src" }}
    <video controls style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;" preload="metadata">
      <source src="{{ .Get "src" }}" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  {{ else if .Get "youtube" }}
    <iframe 
      src="https://www.youtube-nocookie.com/embed/{{ .Get "youtube" }}" 
      title="{{ .Get "title" | default "Workshop Presentation Video" }}"
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  {{ end }}
</div>
