<!-- Zero-Dependency Accessible Carousel Logic -->
<script>
  (function() {
    let currentSlide = 1;
    const totalSlides = 12;

    function initCarousel() {
      const slides = document.querySelectorAll('.carousel-slide');
      const counter = document.getElementById('carousel-counter');
      const prevBtn = document.getElementById('carousel-prev-btn');
      const nextBtn = document.getElementById('carousel-next-btn');
      const dotsContainer = document.getElementById('carousel-dots');

      if (!slides.length || !counter) return;

      // Generate accessible indicator dots
      dotsContainer.innerHTML = '';
      for (let i = 1; i <= totalSlides; i++) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'h-2 w-2 rounded-full transition ' + (i === 1 ? 'bg-white' : 'bg-zinc-700');
        dot.setAttribute('aria-label', 'Go to slide ' + i);
        dot.addEventListener('click', () => showSlide(i));
        dotsContainer.appendChild(dot);
      }

      function showSlide(index) {
        if (index < 1) index = totalSlides;
        if (index > totalSlides) index = 1;
        currentSlide = index;

        slides.forEach((slide, idx) => {
          if (idx + 1 === currentSlide) {
            slide.classList.remove('hidden');
            slide.classList.add('block');
          } else {
            slide.classList.remove('block');
            slide.classList.add('hidden');
          }
        });

        counter.textContent = 'Slide ' + currentSlide + ' of ' + totalSlides;

        // Update dots
        const dots = dotsContainer.querySelectorAll('button');
        dots.forEach((dot, idx) => {
          dot.className = 'h-2 w-2 rounded-full transition ' + (idx + 1 === currentSlide ? 'bg-white' : 'bg-zinc-700');
        });
      }

      if (prevBtn) prevBtn.addEventListener('click', () => showSlide(currentSlide - 1));
      if (nextBtn) nextBtn.addEventListener('click', () => showSlide(currentSlide + 1));

      // Enable Keyboard Navigation (ArrowLeft / ArrowRight) when focused on carousel
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') showSlide(currentSlide - 1);
        if (e.key === 'ArrowRight') showSlide(currentSlide + 1);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCarousel);
    } else {
      initCarousel();
    }
  })();
</script>
